<svg xmlns="http://www.w3.org/2000/svg" width="420" height="92" viewBox="0 0 420 92" role="img" aria-labelledby="title desc">
  <title id="title">SMAP soil moisture legend</title>
  <desc id="desc">Volumetric soil moisture from 0.00 to 0.60 cubic meters per cubic meter.</desc>
  <defs><linearGradient id="scale" x1="0" x2="1"><stop offset="0" stop-color="#fdae61"/><stop offset=".25" stop-color="#d9ef8b"/><stop offset=".5" stop-color="#66bd63"/><stop offset=".75" stop-color="#3288bd"/><stop offset="1" stop-color="#5e4fa2"/></linearGradient></defs>
  <text x="210" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600">Soil moisture (m3/m3)</text>
  <rect x="18" y="27" width="384" height="24" rx="2" fill="url(#scale)"/>
  <g fill="#333" font-family="Arial, sans-serif" font-size="11"><text x="18" y="70">0.00</text><text x="210" y="70" text-anchor="middle">0.30</text><text x="402" y="70" text-anchor="end">0.60+</text></g>
</svg>
