<svg xmlns="http://www.w3.org/2000/svg" width="420" height="92" viewBox="0 0 420 92" role="img" aria-labelledby="title desc">
  <title id="title">GPM IMERG precipitation legend</title>
  <desc id="desc">Precipitation rate from 0 to 50 millimeters per hour.</desc>
  <defs><linearGradient id="scale" x1="0" x2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset=".25" stop-color="#9ecae1"/><stop offset=".5" stop-color="#3182bd"/><stop offset=".75" stop-color="#08519c"/><stop offset="1" stop-color="#54278f"/></linearGradient></defs>
  <text x="210" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600">mm/hr</text>
  <rect x="18" y="27" width="384" height="24" rx="2" fill="url(#scale)"/>
  <g fill="#333" font-family="Arial, sans-serif" font-size="11"><text x="18" y="70">0</text><text x="210" y="70" text-anchor="middle">10</text><text x="402" y="70" text-anchor="end">50+</text></g>
</svg>
