<svg xmlns="http://www.w3.org/2000/svg" width="420" height="92" viewBox="0 0 420 92" role="img" aria-labelledby="title desc">
  <title id="title">MODIS Terra NDVI legend</title>
  <desc id="desc">Normalized difference vegetation index from -0.2 to 1.0.</desc>
  <defs><linearGradient id="scale" x1="0" x2="1"><stop offset="0" stop-color="#7f3b08"/><stop offset=".25" stop-color="#d9a441"/><stop offset=".5" stop-color="#e7e7a5"/><stop offset=".75" stop-color="#56a947"/><stop offset="1" stop-color="#006837"/></linearGradient></defs>
  <text x="210" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600">NDVI</text>
  <rect x="18" y="27" width="384" height="24" rx="2" fill="url(#scale)"/>
  <g fill="#333" font-family="Arial, sans-serif" font-size="11"><text x="18" y="70">-0.2</text><text x="210" y="70" text-anchor="middle">0.4</text><text x="402" y="70" text-anchor="end">1.0</text></g>
</svg>
